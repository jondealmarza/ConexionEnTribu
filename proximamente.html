<style>
  :root{
    --bg:#F6EDE3;
    --ink:#1D4A46;
    --ink-soft:#2F5C57;
    --coral:#C8685A;
    --gold:#D2A02F;
    --muted:#7A7369;
    --serif:'Lora', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans:'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100svh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:18px;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
    background:radial-gradient(120% 70% at 50% -10%, #FBF4EC 0%, var(--bg) 62%);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%;height:clamp(88px,18vh,140px);width:auto;aspect-ratio:101/140;margin:0 auto}
  .eyebrow{
    font-size:11.5px;
    font-weight:900;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
  }
  h1{
    font-family:var(--serif);
    font-size:clamp(28px,8vw,38px);
    font-weight:700;
    letter-spacing:-.01em;
    margin:0;
    max-width:16ch;
  }
  p{
    margin:0;
    max-width:34ch;
    color:var(--muted);
    font-size:16px;
  }
  .back{
    margin-top:8px;
    display:inline-block;
    padding:11px 24px;
    border-radius:999px;
    background:var(--ink);
    color:#FBF4EA;
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
    box-shadow:0 8px 18px -12px rgba(29,74,70,.75);
    transition:transform .18s ease;
  }
  .back:active{transform:scale(.982)}
</style>
